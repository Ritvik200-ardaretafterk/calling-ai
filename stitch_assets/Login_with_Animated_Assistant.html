<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            background-color: #f4fafc;
            color: #161d1e;
            overflow-x: hidden;
        }
        .focused-canvas {
            max-width: 480px;
            width: 100%;
        }
        .input-underline {
            border-bottom-width: 1px;
            border-color: #6e7976;
            transition: border-color 0.2s ease, border-bottom-width 0.2s ease;
        }
        .input-underline:focus {
            outline: none;
            border-color: #006b5c;
            border-bottom-width: 2px;
        }
        
        /* Assistant Animations */
        #assistant-container {
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
        }
        /* Peeping initial state */
        .assistant-peep {
            transform: translate(45%, 45%) rotate(-10deg);
        }
        /* Welcome animation state */
        .assistant-welcome {
            transform: translate(-50%, 0) scale(1.1);
            left: 50% !important;
            right: auto !important;
            bottom: 0 !important;
        }
        /* Fade out state */
        .assistant-exit {
            opacity: 0;
            transform: translate(-50%, 50%) scale(0.9);
            pointer-events: none;
        }
        .speech-bubble {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        .speech-bubble.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Float animation for the peeping state */
        @keyframes float {
            0% { transform: translate(45%, 45%) rotate(-10deg); }
            50% { transform: translate(42%, 42%) rotate(-8deg); }
            100% { transform: translate(45%, 45%) rotate(-10deg); }
        }
        .assistant-peep.floating {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="font-body-md text-body-md flex min-h-screen items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<main class="focused-canvas bg-surface-container-lowest p-stack-lg rounded-xl border border-outline-variant/10 shadow-sm transition-all duration-500 hover:shadow-md relative z-10">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center text-center mb-stack-lg">
<div class="mb-stack-md flex items-center justify-center bg-primary-container/20 w-16 h-16 rounded-full">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="auto_awesome">auto_awesome</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Welcome to ConvoPilot</h1>
<p class="font-body-md text-on-surface-variant max-w-sm">Capture clarity from every conversation. Your digital zen workspace for meetings and notes.</p>
</div>
<!-- Authentication Core -->
<div class="space-y-stack-md">
<!-- Google Sign In (Primary Action) -->
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest border border-outline px-4 py-3 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all active:scale-[0.98]">
<svg height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
            Sign in with Google
        </button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-grow h-px bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline">OR</span>
<div class="flex-grow h-px bg-outline-variant/30"></div>

<!-- Email Sign In Form -->
<form class="space-y-stack-md" onsubmit="event.preventDefault(); triggerWelcome();">
<div class="group relative">

<input class="w-full bg-transparent input-underline py-2 font-body-md text-on-surface placeholder:text-outline/50" id="email" placeholder="name@company.com" type="email">
</div>
<div class="group relative">

</div>

</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:brightness-110 transition-all active:scale-[0.98] mt-stack-md" id="email-signin-btn" type="submit">
                Sign in with email
            </button>
</form>
</div>

<p class="font-body-md text-on-surface-variant">
            New to ConvoPilot? 
            <a class="font-label-md text-label-md text-primary hover:underline ml-1" href="#" id="create-account-btn" onclick="triggerWelcome(); return false;">Create an account</a>
</p>
</footer>
</main>
<!-- Assistant Visual Element -->

<!-- Ambient Visual Elements -->

<script>
    // Logic for Assistant Entrance and Welcome Animation
    window.addEventListener('load', () => {
        const bubble = document.getElementById('speech-bubble');
        setTimeout(() => {
            bubble.classList.add('visible');
        }, 1000);
    });

    function triggerWelcome() {
        const assistant = document.getElementById('assistant-container');
        const bubble = document.getElementById('speech-bubble');
        const speechText = document.getElementById('speech-text');
        
        // Hide bubble momentarily to change text
        bubble.classList.remove('visible');
        
        setTimeout(() => {
            // Switch to welcome state
            assistant.classList.remove('assistant-peep', 'floating');
            assistant.classList.add('assistant-welcome');
            
            speechText.innerText = "Welcome!";
            
            // Show bubble with Welcome!
            setTimeout(() => {
                bubble.classList.add('visible');
                
                // Final exit animation after a delay
                setTimeout(() => {
                    bubble.classList.remove('visible');
                    assistant.classList.add('assistant-exit');
                }, 1500);
            }, 500);
        }, 300);
    }

    // Subtle micro-interaction: Add a little tilt to the card on mouse move
    const card = document.querySelector('main');
    document.addEventListener('mousemove', (e) => {
        if (window.innerWidth > 768) {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 100;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 100;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        }
    });

    // Reset rotation when mouse leaves
    document.addEventListener('mouseleave', () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
</script>
