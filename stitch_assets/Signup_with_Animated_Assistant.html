<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ConvoPilot - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

          extend: {

                    "on-tertiary": "#ffffff",

                    "secondary-container": "#a7eafb",
                    "on-secondary-container": "#216b7a",
                    "on-secondary-fixed-variant": "#004e5b",

                    "on-secondary-fixed": "#001f25",
                    "primary-fixed": "#9ef2df",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "secondary": "#1b6776",
                    "tertiary-fixed-dim": "#afcdc3",
                    "surface-dim": "#d5dbdd",
                    "secondary-fixed": "#aaedfe",
                    "tertiary": "#48645c",
                    "surface-container-lowest": "#ffffff",
                    "inverse-on-surface": "#ecf2f4",
                    "on-tertiary-fixed": "#03201a",
                    "tertiary-container": "#a4c2b8",
                    "on-tertiary-container": "#355049",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#82d6c4",
                    "surface": "#f4fafc",
                    "outline-variant": "#bec9c5",
                    "tertiary-fixed": "#cae9df",
                    "error-container": "#ffdad6",
                    "surface-tint": "#006b5c",
                    "primary": "#006b5c",
                    "on-tertiary-fixed-variant": "#314c45",
                    "surface-container-high": "#e3e9eb",
                    "on-primary-fixed": "#00201b",
                    "on-surface-variant": "#3e4946",
                    "on-background": "#161d1e",

            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",

            "spacing": {

                    "stack-lg": "32px",
                    "container-max-width": "1200px",
                    "unit": "8px",
                    "stack-sm": "8px",
                    "gutter": "24px",
                    "margin-desktop": "40px"
            },
            "fontFamily": {
                    "label-sm": ["JetBrains Mono"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Manrope"],
                    "headline-lg-mobile": ["Manrope"],
                    "body-lg": ["Inter"],
                    "label-md": ["JetBrains Mono"],

                    "display-lg": ["Manrope"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],

                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #bec9c5; border-radius: 10px; }
        
        .quiet-focus-bg {
            background-color: #f4fafc;
            background-image: radial-gradient(at 0% 0%, #eff5f7 0, transparent 50%), radial-gradient(at 50% 0%, #ffffff 0, transparent 50%);
        }

        .input-underline {
            border-bottom: 1px solid #6e7976;
            transition: border-color 0.3s ease, border-width 0.1s ease;
        }
        .input-underline:focus {
            outline: none;
            border-bottom: 2px solid #006b5c;
        }

        /* Assistant Animation Styles */
        #assistant-container {
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Initial peeping position: hidden off bottom-right */
            transform: translate(60%, 80%);
            bottom: 0;
            right: 0;
            opacity: 0;
        }
        #assistant-container.peeping {
            /* Peeping state: visible in corner */
            transform: translate(30%, 30%);
            opacity: 1;
        }
        #assistant-container.active {
            /* Active "Welcome" position: bottom center */
            transform: translate(-50%, 0) scale(1.1);
            left: 50% !important;
            right: auto !important;
            bottom: 0 !important;
            opacity: 1;
        }
        #assistant-container.fade-out {
            opacity: 0;
            transform: translate(-50%, 20px) scale(0.9);
            pointer-events: none;
        }

        #speech-bubble {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }
        #assistant-container.peeping #speech-bubble,
        #assistant-container.active #speech-bubble {
            opacity: 1;
            transform: translateY(0);
        }
        .assistant-img {
            mix-blend-mode: multiply;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen quiet-focus-bg overflow-x-hidden">
<!-- Top AppBar -->
<header class="w-full top-0 sticky z-50 bg-background/80 backdrop-blur-md">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 w-full max-w-container-max-width mx-auto">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md font-bold text-primary">ConvoPilot</span>
</div>
<div class="hidden md:flex items-center gap-6">
<a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy</a>
<a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Terms</a>
</div>
</div>
</header>
<main class="flex flex-col items-center justify-center min-h-[calc(100vh-80px)] px-margin-mobile pb-20">
<div class="w-full max-w-[420px] space-y-stack-lg relative z-10">
<div class="text-center space-y-2">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Experience Clarity</h1>
<p class="text-on-surface-variant font-body-md">Create your workspace for deep focus and organized thought.</p>
</div>
<div class="bg-surface-container-lowest p-8 md:p-10 rounded-lg border border-outline-variant/30 shadow-sm transition-all hover:shadow-md">
<form class="space-y-6" id="signupForm">
<div class="flex flex-col gap-2">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<input class="bg-transparent py-2 px-0 text-body-md font-body-md placeholder:text-outline-variant input-underline" id="fullName" name="fullName" placeholder="Enter your full name" type="text">
</div>
<div class="flex flex-col gap-2">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<input class="bg-transparent py-2 px-0 text-body-md font-body-md placeholder:text-outline-variant input-underline" id="email" name="email" placeholder="name@company.com" type="email">
</div>
<div class="flex flex-col gap-2">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<input class="bg-transparent py-2 px-0 text-body-md font-body-md placeholder:text-outline-variant input-underline" id="password" name="password" placeholder="••••••••" type="password">
</div>
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-label-md text-label-md transition-all hover:opacity-90 active:scale-[0.98] mt-2 btn-trigger" type="submit">
                    Create Account
                </button>
</form>
<div class="relative my-8 text-center">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<span class="relative bg-surface-container-lowest px-4 text-label-sm font-label-sm text-outline">OR</span>
</div>
<button class="w-full flex items-center justify-center gap-3 border border-outline text-on-surface-variant py-3 rounded-lg font-label-md text-label-md transition-all hover:bg-surface-container-low active:scale-[0.98] btn-trigger" id="googleSignup" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="currentColor"></path>
</svg>
                Sign up with Google
            </button>
</div>
<p class="text-center text-on-surface-variant text-body-md">
            Already have an account? 
            <a class="text-primary font-semibold hover:underline underline-offset-4 decoration-2" href="#">Log in</a>
</p>
</div>
</main>
<!-- Assistant Character Container -->

<!-- Decorative Elements -->
<div class="fixed top-20 -right-20 w-[600px] h-[600px] bg-secondary/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<div class="fixed -bottom-40 -left-20 w-[400px] h-[400px] bg-primary/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('signupForm');
        const googleBtn = document.getElementById('googleSignup');
        const inputs = form.querySelectorAll('input');
        const assistant = document.getElementById('assistant-container');
        const speechBubble = document.getElementById('speech-bubble');
        const speechText = document.getElementById('speech-text');

        // Initial peeping animation on load
        setTimeout(() => {
            assistant.classList.add('peeping');
        }, 800);

        const triggerWelcome = () => {
            // Change message
            speechText.innerText = "Welcome!";
            // Move to center
            assistant.classList.remove('peeping');
            assistant.classList.add('active');

            // Fade out after a short delay
            setTimeout(() => {
                assistant.classList.add('fade-out');
            }, 2500);
        };

        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#006b5c';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.color = '#3e4946';
            });
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">refresh</span> Creating...';
            btn.disabled = true;
            
            triggerWelcome();

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 2000);
        });

        googleBtn.addEventListener('click', () => {
            triggerWelcome();
        });
    });
</script>


</body></html>
